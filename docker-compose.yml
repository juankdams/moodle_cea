services:
  mariadb:
    image: mariadb:10.6
    container_name: moodle-db
    environment:
      # ¡Recuerda usar tus contraseñas seguras aquí!
      MYSQL_ROOT_PASSWORD: "your_strong_root_password"
      MYSQL_DATABASE: "moodle"
      MYSQL_USER: "moodleuser"
      MYSQL_PASSWORD: "your_strong_moodle_password"
    volumes:
      - db_data:/var/lib/mysql
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    restart: unless-stopped

  moodle:
    build: .
    container_name: moodle-app
    ports:
      - "8080:80"
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_USER: "soluciones"
      MOODLE_DATABASE_PASSWORD: "Damsjuan10!"
      MOODLE_DATABASE_NAME: "moodle"
    volumes:
      - moodle_code:/var/www/html
      - moodledata_data:/var/www/moodledata
    depends_on:
      - mariadb
    restart: unless-stopped

volumes:
  db_data:
  moodle_code:
  moodledata_data:
