services:
  mariadb:
    image: mariadb:10.6
    container_name: moodle-db
    restart: unless-stopped
    environment:
      # Ambas contraseñas ahora usan variables que configurarás en Dokploy
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "moodle"
      MYSQL_USER: "moodleuser"
      # --- CORRECCIÓN CLAVE: Usamos la variable para consistencia ---
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    networks:
      - moodle-net

  moodle:
    build: .
    container_name: moodle-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Estas variables se conectan a la configuración de mariadb
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_USER: "moodleuser"
      MOODLE_DATABASE_PASSWORD: "${DB_PASSWORD}"
      MOODLE_DATABASE_NAME: "moodle"
    depends_on:
      - mariadb
    volumes:
      - moodle_code:/var/www/html
      - moodledata_data:/var/www/moodledata
    networks:
      - moodle-net

networks:
  moodle-net:
    driver: bridge

volumes:
  db_data:
  moodle_code:
  moodledata_data:
