# ===============================================================
#   Docker Compose para Moodle con PostgreSQL
#   Credenciales: user=soluciones, pwd=Damsjuan10!
# ===============================================================
version: '3.8'

services:
  # --- Servicio de Base de Datos PostgreSQL ---
  postgres:
    image: postgres:15
    container_name: moodle-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "moodle"
      POSTGRES_USER: "soluciones"      # Tu usuario especificado
      POSTGRES_PASSWORD: "Damsjuan10!" # Tu contraseña especificada
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moodle-net

  # --- Servicio de Aplicación Moodle ---
  moodle:
    build: .
    container_name: moodle-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Variables para conectar Moodle con PostgreSQL
      MOODLE_DB_TYPE: "pgsql"
      MOODLE_DATABASE_HOST: "postgres"
      MOODLE_DATABASE_NAME: "moodle"
      MOODLE_DATABASE_USER: "soluciones"      # Tu usuario especificado
      MOODLE_DATABASE_PASSWORD: "Damsjuan10!" # Tu contraseña especificada
    depends_on:
      - postgres
    volumes:
      - moodle_code:/var/www/html
      - moodledata_data:/var/www/moodledata
    networks:
      - moodle-net

# --- Configuración de Red ---
networks:
  moodle-net:
    driver: bridge

# --- Definición de Volúmenes ---
volumes:
  postgres_data:
  moodle_code:
  moodledata_data:
