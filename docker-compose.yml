services:
  mariadb:
    image: mariadb:10.6
    container_name: moodle-db
    environment:
      # Asegúrate de que estas contraseñas sean seguras
      MYSQL_ROOT_PASSWORD: "your_strong_root_password"
      MYSQL_DATABASE: "moodle"
      MYSQL_USER: "moodleuser"
      MYSQL_PASSWORD: "your_strong_moodle_password"
    volumes:
      - db_data:/var/lib/mysql
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    restart: unless-stopped

  moodle:
    # --- ¡ESTE ES EL CAMBIO CLAVE! ---
    # En lugar de descargar una imagen, le decimos que la construya
    # usando el Dockerfile que se encuentra en el directorio actual ('.')
    build: .
    container_name: moodle-app
    ports:
      - "8080:80" # Moodle correrá en el puerto 80 dentro del contenedor
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_USER: "moodleuser"
      MOODLE_DATABASE_PASSWORD: "your_strong_moodle_password"
      MOODLE_DATABASE_NAME: "moodle"
    volumes:
      # Mapeamos la carpeta del código a un volumen para persistencia (opcional pero recomendado)
      - moodle_code:/var/www/html
      # Mapeamos la carpeta de datos a un volumen para que los archivos no se borren
      - moodledata_data:/var/www/moodledata
    depends_on:
      - mariadb
    restart: unless-stopped

volumes:
  db_data:
  moodle_code:
  moodledata_data:
